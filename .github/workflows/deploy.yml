name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test

      # Stamp the deployed build so the footer identifies the exact commit.
      # Semver build metadata: 1.2.0+a1b2c3d. Bumping the base version stays a
      # manual edit of package.json, in step with the semantic commit that makes it.
      - name: Resolve site version
        id: version
        run: |
          base=$(node -p "require('./package.json').version")
          echo "value=${base}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - run: npm run build
        env:
          # GitHub Pages project site is served from /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_APP_VERSION: ${{ steps.version.outputs.value }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
